<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booba</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #1e1e1e;
            display: flex;
        }
        #terminal-container {
            flex: 1;
            min-height: 0;
            padding: 4px;
            overflow: hidden;
        }
        .status {
            position: fixed;
            top: 8px;
            right: 12px;
            font-family: monospace;
            font-size: 12px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #666;
            transition: background-color 0.3s;
        }
        .status-dot.connected { background: #27c93f; }
        .status-dot.disconnected { background: #dc3545; }
        .status-dot.connecting, .status-dot.reconnecting { background: #e6b800; }
        #renderer-info {
            position: fixed;
            bottom: 12px;
            right: 12px;
            font-family: monospace;
            font-size: 11px;
            color: #666;
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="status">
        <span class="status-dot connecting" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
    </div>
    <div id="renderer-info"></div>
    <div id="terminal-container"></div>

    <script type="module">
        import { BoobaTerminal, resolveBoobaURLs } from './static/booba/booba.js';

        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');

        function isLoopbackHost(hostname) {
            return hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1';
        }

        function parseRendererBackend() {
            const params = new URLSearchParams(window.location.search);
            const renderer = params.get('renderer');
            if (renderer === 'canvas2d' || renderer === 'webgpu' || renderer === 'auto') {
                return renderer;
            }
            // Fall back to server's default renderer preference (set by server in handleIndex)
            return window.__boobaDefaultRenderer || 'auto';
        }

        async function main() {
            const booba = new BoobaTerminal('terminal-container', {
                renderer: parseRendererBackend(),
            });

            booba.onStatusChange = (state, message) => {
                dot.className = `status-dot ${state}`;
                text.textContent = message;
            };

            booba.onTitleChange = (title) => {
                document.title = title || 'booba';
            };

            booba.onBell = () => {
                const c = document.getElementById('terminal-container');
                c.style.outline = '2px solid #ffbd2e';
                setTimeout(() => { c.style.outline = 'none'; }, 150);
            };

            await booba.init();

            // Resolve endpoints relative to the page so booba works behind
            // a path-prefix reverse proxy that strips the prefix.
            const urls = resolveBoobaURLs(document.baseURI);
            const webTransportOK = typeof WebTransport !== 'undefined' &&
                (window.location.protocol === 'https:' || isLoopbackHost(window.location.hostname));

            booba.connectAuto(
                urls.wsUrl,
                webTransportOK ? urls.wtUrl : null,
                webTransportOK ? urls.certHashUrl : null,
            );
            booba.focus();

            // Handle mobile keyboard showing/hiding using visualViewport API
            if (window.visualViewport) {
                const container = document.getElementById('terminal-container');
                window.visualViewport.addEventListener('resize', () => {
                    const keyboardHeight = window.innerHeight - window.visualViewport.height;
                    if (keyboardHeight > 100) {
                        container.style.height = window.visualViewport.height + 'px';
                    } else {
                        container.style.height = '';
                    }
                    booba.fitAddon?.fit();
                });
            }

            // Install renderer info display (backend + FPS)
            const rendererInfoEl = document.getElementById('renderer-info');
            let frames = 0;
            let lastTick = performance.now();
            const updateRendererInfo = () => {
                frames++;
                const now = performance.now();
                if (now - lastTick >= 1000) {
                    const backend = booba.terminal?.renderer?.backend || '?';
                    rendererInfoEl.textContent = `${backend} ${frames} fps`;
                    frames = 0;
                    lastTick = now;
                }
                requestAnimationFrame(updateRendererInfo);
            };
            requestAnimationFrame(updateRendererInfo);

            // Alt+Shift+R: toggle between WebGPU and Canvas2D
            document.addEventListener('keydown', (e) => {
                if (e.altKey && e.shiftKey && (e.key === 'R' || e.key === 'r')) {
                    e.preventDefault();
                    const cur = booba.terminal?.renderer?.backend;
                    const next = cur === 'webgpu' ? 'canvas2d' : 'webgpu';
                    const url = new URL(window.location.href);
                    url.searchParams.set('renderer', next);
                    window.location.href = url.toString();
                }
            });
        }

        main().catch(console.error);
    </script>
</body>
</html>
