# Source of truth for the demo site. Consumed by cmd/wasm-build.
groups:
  - title: Bubble Tea in the browser
    demos:
      - name: views
        title: Multiple views
        blurb: The Bubble Tea <em>views</em> sample, compiled to WebAssembly and running entirely in your browser. Press <kbd>j</kbd>/<kbd>k</kbd> and <kbd>Enter</kbd>.
        source: ./cmd/booba-view-example
  - title: Terminal input
    demos:
      - name: tracking
        title: Touch and mouse tracking
        blurb: Draw with a finger or mouse, pinch to send wheel events, and inspect the terminal input. Keyboard and mouse tracking have separate controls.
        source: ./web/_assets/touch-tracking.js
        browser_only: true
        page: tracking
  - title: Terminal rendering
    demos:
      - name: colors
        title: Colors and text styles
        blurb: Explore ANSI colors, the 256-color palette, RGB gradients, and styled text. Switch renderers to compare the same output.
        source: ./web/_assets/colors.js
        browser_only: true
        page: colors
      - name: rtl
        title: Right-to-left text
        blurb: Hebrew, Arabic, and Persian samples with styled runs and browser reference text. Compare bidirectional ordering and the known cursive-shaping limitation.
        source: ./tests/rtl-text
        page: rtl
  - title: Terminal Actions (experimental)
    demos:
      - name: actions
        title: Touch controls from help bindings
        blurb: The program publishes its help map over OSC 7501; booba renders it as buttons that send ordinary key input back.
        source: ./cmd/booba-actions-example
        page: actions
